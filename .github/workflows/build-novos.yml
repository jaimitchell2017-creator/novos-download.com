name: Build NOVOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  PROJECT_DIR: "NOVOS"

jobs:
  build-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:windows
            output: "release/NOVOS Setup 1.0.0.exe"
            artifact: "NOVOS-Setup.exe"
          - os: ubuntu-latest
            script: desktop:linux
            output: "release/NOVOS-1.0.0.AppImage"
            artifact: "NOVOS.AppImage"
          - os: macos-latest
            script: desktop:mac
            output: "release/NOVOS-1.0.0.dmg"
            artifact: "NOVOS.dmg"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract NOVOS source
        shell: bash
        run: |
          unzip -q NOVOS-upload-ready.zip
          test -f "${PROJECT_DIR}/package.json"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build desktop app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run ${{ matrix.script }}

      - name: Check desktop output
        shell: bash
        run: |
          test -f "${PROJECT_DIR}/${{ matrix.output }}"
          cp "${PROJECT_DIR}/${{ matrix.output }}" "${{ matrix.artifact }}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Do not let setup-android try to install the obsolete "tools" package.
      # The previous failure happened inside that automatic installation step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Extract NOVOS source
        shell: bash
        run: |
          unzip -q NOVOS-upload-ready.zip
          test -f "${PROJECT_DIR}/package.json"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Install Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run web:build

      - name: Add and sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Install Android build packages
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          test -n "$SDKMANAGER"

          COMPILE_SDK="$(grep -E 'compileSdkVersion' android/variables.gradle | head -1 | grep -oE '[0-9]+' | head -1 || true)"
          BUILD_TOOLS="$(grep -E 'buildToolsVersion' android/variables.gradle | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"

          COMPILE_SDK="${COMPILE_SDK:-35}"
          BUILD_TOOLS="${BUILD_TOOLS:-35.0.0}"

          echo "Installing Android platform: android-${COMPILE_SDK}"
          echo "Installing Android build tools: ${BUILD_TOOLS}"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS}"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Copy APK
        shell: bash
        run: cp "${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk" NOVOS.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVOS.apk
          path: NOVOS.apk

  build-ios:
    name: iOS (unsigned simulator build)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract NOVOS source
        shell: bash
        run: |
          unzip -q NOVOS-upload-ready.zip
          test -f "${PROJECT_DIR}/package.json"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Install Capacitor iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Build web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run web:build

      - name: Verify web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -f dist/index.html

      - name: Add and sync iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Locate generated Xcode project
        id: locate_xcode
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=ios/App/App.xcworkspace" >> "$GITHUB_OUTPUT"
          elif [ -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=ios/App/App.xcodeproj" >> "$GITHUB_OUTPUT"
          else
            echo "No Capacitor Xcode workspace/project was found."
            find ios -maxdepth 5 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) -print || true
            exit 1
          fi

      - name: Build unsigned iOS simulator app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ "${{ steps.locate_xcode.outputs.kind }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.locate_xcode.outputs.path }}" \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build
          else
            xcodebuild \
              -project "${{ steps.locate_xcode.outputs.path }}" \
              -scheme App \
              -sdk iphonesimulator \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build
          fi

      - name: Package unsigned iOS app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APP_PATH=$(find build/Build/Products -type d -name "App.app" -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" NOVOS-iOS-unsigned.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVOS-iOS-unsigned.zip
          path: ${{ env.PROJECT_DIR }}/NOVOS-iOS-unsigned.zip
