name: Build NOVOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PROJECT_DIR: 'NOVOS'

jobs:
  build-desktop:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            script: desktop:windows
            output: NOVOS-Setup.exe
          - os: ubuntu-latest
            os_name: Linux
            script: desktop:linux
            output: NOVOS.AppImage
          - os: macos-latest
            os_name: macOS
            script: desktop:mac
            output: NOVOS.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No npm cache here because package.json is inside the ZIP
          # and does not exist until after the extraction step.

      - name: Extract NOVOS source
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q NOVOS-upload-ready.zip
          test -f "$PROJECT_DIR/package.json"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build desktop package
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run ${{ matrix.script }}

      - name: Show release files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: ls -lah release || true

      - name: Prepare artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          case "${{ matrix.os_name }}" in
            Windows)
              test -f "release/NOVOS Setup 1.0.0.exe"
              cp "release/NOVOS Setup 1.0.0.exe" "../NOVOS-Setup.exe"
              ;;
            Linux)
              test -f "release/NOVOS-1.0.0.AppImage"
              cp "release/NOVOS-1.0.0.AppImage" "../NOVOS.AppImage"
              ;;
            macOS)
              test -f "release/NOVOS-1.0.0.dmg"
              cp "release/NOVOS-1.0.0.dmg" "../NOVOS.dmg"
              ;;
          esac

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}
          path: ${{ matrix.output }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract NOVOS source
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q NOVOS-upload-ready.zip
          test -f "$PROJECT_DIR/package.json"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run web:build

      - name: Verify web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -f dist/index.html

      - name: Install Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Capacitor Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../NOVOS.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: NOVOS.apk

  build-ios:
    name: Build unsigned iOS test app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract NOVOS source
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR"
          unzip -q NOVOS-upload-ready.zip
          test -f "$PROJECT_DIR/package.json"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Build web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run web:build

      - name: Verify web assets
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -f dist/index.html

      - name: Install Capacitor iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Add Capacitor iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add ios

      - name: Sync Capacitor iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync ios

      - name: Build unsigned iOS simulator app
        working-directory: ${{ env.PROJECT_DIR }}/ios
        run: |
          xcodebuild             -workspace App/App.xcworkspace             -scheme App             -sdk iphonesimulator             -configuration Release             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Package unsigned iOS app
        working-directory: ${{ env.PROJECT_DIR }}/ios
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/NOVOS-iOS-unsigned.zip" App.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-unsigned
          path: NOVOS-iOS-unsigned.zip
